[project]
name = "bateria-interfaz"
version = "0.1.0"
description = "Batería E2E de la interfaz del entrenador: caja negra, API simulada y fixtures"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8",
  "pytest-bdd>=7",
  "playwright>=1.47",
  "jsonschema>=4.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "web: escenario que se ejecuta en el navegador",
  "android: escenario que se ejecuta en el emulador Android",
  "ios: escenario que se ejecuta en el simulador de iPhone",
  "windows: escenario que se ejecuta en Windows (escritorio)",
]
