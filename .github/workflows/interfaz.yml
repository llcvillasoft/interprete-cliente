name: interfaz

on:
  push:
    branches: [main, pruebas/poc-hoy]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar la biblioteca nativa de audio y sus pruebas en C
        run: |
          cmake -S native/audio_core -B native/audio_core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/audio_core/build --parallel
          ctest --test-dir native/audio_core/build --output-on-failure
          echo "AUDIO_CORE_LIB=$PWD/native/audio_core/build/libaudio_core.so" >> "$GITHUB_ENV"
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Compilar la web de prueba
        run: >
          flutter build web --release
          --dart-define=API_BASE_URL=http://127.0.0.1:8787
          --dart-define=API_DISPOSITIVO=dispositivo-prueba-001
          --dart-define=API_SECRETO=secreto-de-prueba
      - uses: actions/upload-artifact@v6
        with:
          name: app-web
          path: app/build/web

  bateria:
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: app-web
          path: app/build/web
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "pytest>=8" "pytest-bdd>=7" "playwright>=1.47" "jsonschema>=4.18"
      - name: Servir la compilación de la app
        run: nohup python -m http.server 8080 --bind 127.0.0.1 --directory app/build/web > servidor-app.log 2>&1 &
      - name: Ejecutar la batería de interfaz
        working-directory: pruebas
        env:
          BATERIA_APP_URL: http://127.0.0.1:8080/
          BATERIA_API_PUERTO: "8787"
        run: pytest
      - name: Cancelar el run si este job falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  lighthouse:
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: app-web
          path: app/build/web
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Servir la compilación de la app
        run: nohup python -m http.server 8090 --bind 127.0.0.1 --directory app/build/web > servidor-lighthouse.log 2>&1 &
      - name: Esperar a que la app responda
        run: for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/ > /dev/null && exit 0; sleep 1; done; exit 1
      - name: Medir con Lighthouse
        run: >
          npx --yes lighthouse@12 http://127.0.0.1:8090/
          --only-categories=accessibility,best-practices,seo
          --chrome-flags="--headless=new --no-sandbox"
          --output=json --output-path=lighthouse.json --quiet
      - name: Medir el tamaño de los JavaScript de arranque
        run: python -m calidad.tamanos app/build/web > medidas-tamanos.json
      - name: Comprobar los ratchets de Lighthouse y de tamaño
        run: |
          python -m calidad.lighthouse lighthouse.json > medidas-lighthouse.json
          cat medidas-lighthouse.json medidas-tamanos.json
          python -m calidad.evaluar --parcial calidad/linea-base.json medidas-lighthouse.json medidas-tamanos.json
      - name: Puntuaciones en el resumen
        if: always()
        run: cat medidas-lighthouse.json medidas-tamanos.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse
          path: |
            lighthouse.json
            medidas-lighthouse.json
            medidas-tamanos.json
      - name: Cancelar el run si este job falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  android:
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generar la plataforma Android
        run: flutter create --platforms=android --project-name interprete_cliente --org com.llcvillasoft .
      - name: Permitir HTTP hacia la API simulada en la prueba
        run: |
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
      - name: Compilar el APK de prueba
        run: >
          flutter build apk --debug
          --dart-define=API_BASE_URL=http://10.0.2.2:8787
          --dart-define=API_DISPOSITIVO=dispositivo-prueba-001
          --dart-define=API_SECRETO=secreto-de-prueba
      - uses: actions/upload-artifact@v6
        with:
          name: app-android
          path: app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar dependencias de la API simulada
        working-directory: pruebas
        run: python -m pip install "jsonschema>=4.18"
      - name: Levantar la API simulada
        working-directory: pruebas
        run: nohup python -m bateria.lanzar_api --puerto 8787 > servidor-api.log 2>&1 &
      - name: Esperar a la API simulada
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8787/v1/me && exit 0; sleep 1; done; exit 1
      - name: Activar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pruebas de integración en el emulador de Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb -s emulator-5554 wait-for-device
            adb -s emulator-5554 install --no-streaming -r app/build/app/outputs/flutter-apk/app-debug.apk
            cd app && flutter test integration_test -d emulator-5554 --dart-define=API_BASE_URL=http://10.0.2.2:8787 --dart-define=API_DISPOSITIVO=dispositivo-prueba-001 --dart-define=API_SECRETO=secreto-de-prueba
      - name: Cancelar el run si este job falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  windows:
    needs: app
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: flutter pub get
      - name: Generar la plataforma Windows
        run: flutter create --platforms=windows --project-name interprete_cliente --org com.llcvillasoft .
      - name: Quitar la prueba de plantilla que genera flutter create
        shell: pwsh
        run: Remove-Item -Path test/widget_test.dart -ErrorAction SilentlyContinue
      - name: Pruebas unitarias y de widgets en Windows
        run: flutter test
      - name: Compilar la aplicación de Windows de prueba
        run: >
          flutter build windows --debug
          --dart-define=API_BASE_URL=http://127.0.0.1:8787
          --dart-define=API_DISPOSITIVO=dispositivo-prueba-001
          --dart-define=API_SECRETO=secreto-de-prueba
      - name: Instalar dependencias de la API simulada
        working-directory: pruebas
        run: python -m pip install "jsonschema>=4.18"
      - name: Levantar la API simulada
        working-directory: pruebas
        shell: pwsh
        run: Start-Process -FilePath python -ArgumentList '-m', 'bateria.lanzar_api', '--puerto', '8787' -WindowStyle Hidden
      - name: Esperar a la API simulada
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $cliente = [System.Net.Sockets.TcpClient]::new('127.0.0.1', 8787)
              $cliente.Close()
              exit 0
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          exit 1
      - name: Pruebas de integración en Windows
        run: >
          flutter test integration_test -d windows
          --dart-define=API_BASE_URL=http://127.0.0.1:8787
          --dart-define=API_DISPOSITIVO=dispositivo-prueba-001
          --dart-define=API_SECRETO=secreto-de-prueba
      - name: Cancelar el run si este job falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  ios:
    needs: app
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: flutter pub get
      - name: Generar la plataforma iOS
        run: flutter create --platforms=ios --project-name interprete_cliente --org com.llcvillasoft .
      - name: Quitar la prueba de plantilla que genera flutter create
        run: rm -f test/widget_test.dart
      - name: Permitir HTTP hacia la API simulada en la prueba
        run: /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist
      - name: Pruebas unitarias y de widgets en macOS
        run: flutter test
      - name: Compilar la aplicación de iOS de prueba sin firma
        run: >
          flutter build ios --debug --no-codesign
          --dart-define=API_BASE_URL=http://127.0.0.1:8787
          --dart-define=API_DISPOSITIVO=dispositivo-prueba-001
          --dart-define=API_SECRETO=secreto-de-prueba
      - name: Instalar dependencias de la API simulada
        working-directory: pruebas
        run: python -m pip install "jsonschema>=4.18"
      - name: Levantar la API simulada
        working-directory: pruebas
        run: nohup python -m bateria.lanzar_api --puerto 8787 > servidor-api.log 2>&1 &
      - name: Esperar a la API simulada
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8787/v1/me && exit 0; sleep 1; done; exit 1
      - name: Arrancar un iPhone simulado
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIMULADOR=$UDID" >> "$GITHUB_ENV"
      - name: Pruebas de integración en el simulador de iPhone
        run: |
          DEFINES="--dart-define=API_BASE_URL=http://127.0.0.1:8787 --dart-define=API_DISPOSITIVO=dispositivo-prueba-001 --dart-define=API_SECRETO=secreto-de-prueba"
          # Flutter espera la URL del servicio de Dart leyendo el log del simulador.
          # En algunas ejecuciones esa línea no llega y Flutter espera sin límite.
          # Se detecta ese punto exacto (espera sin avance del log) y se reinicia
          # el simulador para repetir la prueba, hasta tres intentos en total.
          for intento in 1 2 3; do
            log="prueba-ios-$intento.log"
            flutter test integration_test -v -d "$SIMULADOR" $DEFINES > "$log" 2>&1 &
            pid=$!
            tail -n +1 -f "$log" &
            seguidor=$!
            atascado=0
            inactivo=0
            ultimo=-1
            while kill -0 "$pid" 2>/dev/null; do
              sleep 15
              tamano=$(wc -c < "$log" | tr -d ' ')
              if [ "$tamano" = "$ultimo" ]; then inactivo=$((inactivo + 15)); else inactivo=0; fi
              ultimo=$tamano
              if [ "$inactivo" -ge 180 ] && tail -n 1 "$log" | grep -q "Waiting for VM Service port"; then
                atascado=1
                break
              fi
            done
            if [ "$atascado" = 0 ]; then
              estado=0
              wait "$pid" || estado=$?
              sleep 2
              kill "$seguidor" 2>/dev/null || true
              exit "$estado"
            fi
            sleep 2
            kill "$seguidor" 2>/dev/null || true
            echo "::warning::La espera del servicio de Dart no avanzó en el intento $intento."
            kill "$pid" 2>/dev/null || true
            pkill -f "flutter test integration_test" 2>/dev/null || true
            pkill -f "simctl spawn" 2>/dev/null || true
            if [ "$intento" -lt 3 ]; then
              xcrun simctl shutdown "$SIMULADOR" || true
              xcrun simctl boot "$SIMULADOR"
              xcrun simctl bootstatus "$SIMULADOR" -b
            fi
          done
          echo "::error::La espera del servicio de Dart no avanzó en los tres intentos."
          exit 1
      - name: Cancelar el run si este job falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
