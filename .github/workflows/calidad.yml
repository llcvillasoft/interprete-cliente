name: calidad

on:
  push:
    branches: [main, calidad/ratchets]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  ratchets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "pytest>=8"
      - name: Pruebas del motor de ratchets
        run: python -m pytest calidad/tests -q
      - name: Cadenas literales de la interfaz
        run: python -m calidad.literales app/lib/presentacion > medidas-literales.json
      - name: Comprobar el ratchet de cadenas literales
        run: |
          cat medidas-literales.json
          python -m calidad.evaluar --parcial calidad/linea-base.json medidas-literales.json
